<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f7fb" />
  <meta name="description" content="具身智能全栈知识图谱：10 个专业、65 门课程、262 个一级模块、808 个可打卡知识点。" />
  <title>Embodied Atlas — 具身全栈知识图谱</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" class="svg-sprite" aria-hidden="true">
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6a9 9 0 0 0-9-2v15a9 9 0 0 1 9 2 9 9 0 0 1 9-2V4a9 9 0 0 0-9 2Z"/><path d="M12 6v15"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 2 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 17l9 5 9-5"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 1.7 6.3L20 10l-6.3 1.7L12 18l-1.7-6.3L4 10l6.3-1.7L12 2ZM19 17l.7 2.3L22 20l-2.3.7L19 23l-.7-2.3L16 20l2.3-.7L19 17Z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m5 12 14 0m-6-6 6 6-6 6"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m-5 5 5-5 5 5M4 17v4h16v-4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 13A9 9 0 0 1 11 3 9 9 0 1 0 21 13Z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></symbol>
  <symbol id="i-graph" viewBox="0 0 24 24"><rect x="2" y="2" width="6" height="6" rx="2"/><rect x="16" y="2" width="6" height="6" rx="2"/><rect x="9" y="16" width="6" height="6" rx="2"/><path d="m8 5 8 0M5 8l7 8m7-8-7 8"/></symbol>
  <symbol id="i-git" viewBox="0 0 24 24"><circle cx="6" cy="3" r="2"/><circle cx="6" cy="21" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 5v14m0-5c0-5 12-2 12-6"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24"><path d="M13 5h6v6M19 5l-9 9"/><path d="M19 13v6H5V5h6"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m5 5 14 14M19 5 5 19"/></symbol>
  <symbol id="i-focus" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></symbol>
</svg>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="identity"><div class="identity-mark"><svg class="icon"><use href="#i-layers"/></svg></div><div><strong>Embodied Atlas</strong><span>你的具身全栈学习空间</span></div></div>
    <div class="sidebar-inner">
      <div class="section-label">WORKSPACE</div>
      <button class="side-home active" id="homeNav"><svg class="icon"><use href="#i-grid"/></svg><span>学习总览</span><svg class="icon small side-tail"><use href="#i-chevron"/></svg></button>
      <div class="section-label majors-label">10 个专业领域</div>
      <nav id="majorNav" aria-label="专业课程导航"></nav>
    </div>
    <div class="sidebar-foot"><div class="save-dot"></div><div><strong>自动保存已开启</strong><small>进度保存在当前浏览器</small></div></div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="top-left"><button id="mobileMenu" class="icon-btn menu-btn" aria-label="打开侧栏"><svg class="icon"><use href="#i-menu"/></svg></button><span class="top-eyebrow">MY LEARNING SPACE</span><span class="top-separator">/</span><span id="crumb" class="top-crumb">总览</span></div>
      <div class="top-actions">
        <label class="search-box"><svg class="icon"><use href="#i-search"/></svg><input id="searchInput" type="search" placeholder="搜索课程或知识点" aria-label="搜索课程或知识点"/><kbd>/</kbd></label>
        <button class="icon-btn" id="themeBtn" aria-label="切换深浅色主题" title="切换主题"><svg class="icon"><use href="#i-moon"/></svg></button>
        <button class="icon-btn" id="exportBtn" aria-label="导出学习进度" title="导出进度备份"><svg class="icon"><use href="#i-download"/></svg></button>
        <button class="icon-btn" id="importBtn" aria-label="导入学习进度" title="导入进度备份"><svg class="icon"><use href="#i-upload"/></svg></button>
        <a class="top-github" href="https://github.com" target="_blank" rel="noopener noreferrer" title="打开 GitHub"><svg class="icon"><use href="#i-git"/></svg><span>GitHub</span></a>
      </div>
    </header>
    <div class="content-frame">
      <main id="mainPane" class="main-pane" tabindex="-1"></main>
      <aside id="inspector" class="inspector-pane" aria-label="学习详情"></aside>
    </div>
  </div>
</div>
<div class="sidebar-scrim" id="sidebarScrim"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden />
<script src="data.js"></script><script src="topics.js"></script><script src="app.js"></script>
</body>
</html>
